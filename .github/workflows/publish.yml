name: Publish to npm

# Manual only. This repo is published from the maintainer's machine, and it has no
# NPM_TOKEN Actions secret, so a release-triggered run cannot authenticate: run
# 34744241747 passed install, build and lint and then failed at `npm publish` with
# `npm error code ENEEDAUTH`. The `release: [published]` trigger is deliberately gone, so
# publishing a GitHub release cannot start a publish job. Re-add it only together with a
# working NPM_TOKEN repository secret.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # This repo does not commit a lockfile (package-lock.json is gitignored),
      # so `npm ci` always fails here — it requires a committed lockfile.
      # The sibling n8n-nodes-hudu-core edition publishes the same way.
      - run: npm install

      - run: npm run build

      - run: npm run lint

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
